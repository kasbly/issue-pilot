<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>issue-pilot status</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#262b35; --fg:#e6e9ef; --dim:#8b93a3;
          --ok:#4cc38a; --warn:#e5b454; --bad:#e5646e; --accent:#6ea8fe; }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px; background:var(--bg); color:var(--fg);
         font:14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  h1 { font-size:16px; margin:0 0 4px; } h2 { font-size:13px; color:var(--dim); margin:28px 0 10px; text-transform:uppercase; letter-spacing:.08em; }
  #meta { color:var(--dim); font-size:12px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px; margin-top:16px; }
  #queue { grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .card .name { font-weight:600; font-size:15px; }
  .kind { font-size:11px; color:var(--dim); border:1px solid var(--line); border-radius:99px; padding:1px 8px; margin-left:8px; }
  .big { font-size:28px; font-weight:700; margin:10px 0 2px; }
  .bar { position:relative; height:10px; background:#0a0c10; border:1px solid var(--line); border-radius:99px; margin:10px 0 6px; overflow:hidden; }
  .bar .fill { position:absolute; inset:0 auto 0 0; border-radius:99px; }
  .bar .pace { position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--fg); opacity:.7; }
  .row { display:flex; justify-content:space-between; color:var(--dim); font-size:12px; }
  .drift { font-size:12px; margin-top:6px; }
  .ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)} .dim{color:var(--dim)}
  table { width:100%; border-collapse:collapse; }
  td, th { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line); font-size:13px; }
  th { color:var(--dim); font-weight:500; font-size:12px; }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  .pill { display:inline-block; border-radius:99px; padding:1px 10px; font-size:12px; border:1px solid var(--line); }
  .empty { color:var(--dim); padding:10px 0; }
  button { background:#232836; color:var(--fg); border:1px solid var(--line); border-radius:8px;
           padding:5px 12px; font:inherit; font-size:12px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#0b0d12; font-weight:600; border:none; }
  .toggle { width:38px; height:20px; border-radius:99px; background:#2a2f3c; border:1px solid var(--line);
            position:relative; cursor:pointer; display:inline-block; vertical-align:middle; }
  .toggle::after { content:""; position:absolute; top:2px; left:2px; width:14px; height:14px;
                   border-radius:50%; background:var(--dim); transition:all .15s; }
  .toggle.on { background:rgba(76,195,138,.25); border-color:var(--ok); }
  .toggle.on::after { left:20px; background:var(--ok); }
  .quote { border-left:3px solid var(--line); padding:6px 12px; color:var(--dim); font-size:12px; margin:10px 0; white-space:pre-wrap; }
  textarea { width:100%; background:#0a0c10; color:var(--fg); border:1px solid var(--line);
             border-radius:8px; padding:8px; font:inherit; font-size:13px; }
  select { background:#0a0c10; color:var(--fg); border:1px solid var(--line);
           border-radius:8px; padding:4px 8px; font:inherit; font-size:12px; }
  .controls { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--accent);
           color:#0b0d12; padding:8px 18px; border-radius:99px; font-weight:600; display:none; z-index:9; }
</style>

<h1>issue-pilot <span id="dispatch" class="pill"></span>
  <button id="power" style="margin-left:10px"></button></h1>
<div id="meta"></div>
<div id="campaignSec"></div>
<div class="cards" id="accounts"></div>
<h2>Queue &amp; refill</h2>
<div class="cards" id="queue"></div>
<div id="refill" class="drift" style="margin-top:8px"></div>
<h2>Release</h2>
<div class="cards" id="release"></div>
<h2>Routine scanners</h2><div id="scanners"></div>
<h2>Lanes</h2><div id="lanes"></div>
<div id="resources" class="drift" style="margin-top:8px"></div>
<div class="toast" id="toast"></div>
<h2>Working now</h2><div id="workers"></div>
<h2>Claimed issues</h2><div id="claimed"></div>
<h2>Recent PRs</h2><div id="prs"></div>

<script>
const WEEK = 604800;
const fmtDur = s => {
  if (s == null || s < 0) return "–";
  const d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
};
const esc = t => { const e = document.createElement("span"); e.textContent = t ?? ""; return e.innerHTML; };

function toast(t) {
  const el = document.getElementById("toast");
  el.textContent = t; el.style.display = "block";
  clearTimeout(el._t); el._t = setTimeout(() => el.style.display = "none", 2600);
}
async function api(payload, msg) {
  try {
    const res = await fetch("/api/action", { method: "POST", body: JSON.stringify(payload) });
    const out = await res.json();
    if (out.ok) { toast(msg); setTimeout(refresh, 4000); }
    else toast("failed: " + (out.error || "unknown"));
  } catch { toast("API unreachable (static server?)"); }
}
function newCampaign() {
  const goal = document.getElementById("goalText").value.trim();
  if (goal.length < 10) return toast("write the goal first (10+ chars)");
  api({ action: "campaign_set", goal }, "campaign started — first gap analysis on next tick");
}

async function refresh() {
  let s;
  try { s = await (await fetch("status.json", {cache:"no-store"})).json(); }
  catch { document.getElementById("meta").textContent = "status.json unavailable"; return; }
  const now = Math.floor(Date.now()/1000);

  const off = !!s.paused;
  document.getElementById("dispatch").textContent =
    off ? "PAUSED" : "dispatch: " + (s.dispatch || "?");
  document.getElementById("dispatch").className =
    "pill " + (off ? "warn" : s.dispatch === "active" ? "ok" : "bad");
  const power = document.getElementById("power");
  power.textContent = off ? "▶ Start system" : "⏸ Pause system";
  power.className = off ? "primary" : "";
  power.onclick = () => api(
    { action: off ? "system_resume" : "system_pause" },
    off ? "system started — lanes resume within a minute"
        : "system paused — scanning, pacing and running batches stop");
  document.getElementById("meta").textContent = "data collected " + fmtDur(now - s.generated_at) + " ago · page refreshes every 60s";

  document.getElementById("accounts").innerHTML = (s.accounts || []).map(a => {
    const secs = a.resets_at ? a.resets_at - now : null;
    const expected = secs != null ? Math.max(0, Math.min(100, 100 * (1 - secs/WEEK))) : null;
    const drift = (a.used_pct != null && expected != null) ? expected - a.used_pct : null;
    const cls = drift == null ? "" : drift > 10 ? "warn" : drift < -10 ? "bad" : "ok";
    const driftTxt = drift == null ? "no data" :
      Math.abs(drift) < 1 ? "on pace" :
      drift > 0 ? `${drift.toFixed(0)}% behind pace${drift > 10 ? " — quota will be left over" : ""}` :
      `${(-drift).toFixed(0)}% ahead of pace`;
    const stale = a.kind === "codex" && a.stale_secs > 3600 ? ` · snapshot ${fmtDur(a.stale_secs)} old` : "";
    const h5 = a.five_hour_pct != null
      ? ` · 5h window ${a.five_hour_pct.toFixed(0)}%${a.five_hour_pct >= 85 ? " ⚠" : ""}` : "";
    return `<div class="card">
      <span class="name">${esc(a.name)}</span><span class="kind">${esc(a.kind)}</span>
      <div class="big">${a.used_pct != null ? a.used_pct.toFixed(1) + "%" : "–"}</div>
      <div class="bar">
        <div class="fill" style="width:${a.used_pct ?? 0}%; background:${drift != null && drift > 10 ? "var(--warn)" : "var(--accent)"}"></div>
        ${expected != null ? `<div class="pace" style="left:${expected}%" title="ideal pace ${expected.toFixed(0)}%"></div>` : ""}
      </div>
      <div class="row"><span>resets in ${fmtDur(secs)}</span>
        <span>${a.resets_at ? new Date(a.resets_at*1000).toLocaleString(undefined,{weekday:"short",hour:"2-digit",minute:"2-digit"}) : ""}</span></div>
      <div class="drift ${cls}">${driftTxt}${esc(h5)}${esc(stale)}</div>
    </div>`;
  }).join("");

  const r = s.refill || {}, t = s.throughput || {};
  const tile = (label, value, cls) =>
    `<div class="card"><div class="row"><span>${label}</span></div><div class="big ${cls || ""}">${value}</div></div>`;
  document.getElementById("queue").innerHTML =
    tile("ready issues", `${r.ready ?? "–"}`, (r.ready != null && r.ready < r.threshold) ? "bad" : "") +
    tile("open issues", r.open_issues ?? "–") +
    tile("PRs merged today", t.merged_today ?? "–", "ok") +
    tile("PRs merged yesterday", t.merged_yesterday ?? "–");
  const lastR = r.last
    ? `last refill check ${fmtDur(now - r.last.ts)} ago — ${r.last.action === "ran" ? "scanner RAN" : "skipped"} (${esc(r.last.detail)}, threshold ${r.threshold})`
    : `no refill check recorded yet (threshold ${r.threshold ?? "?"})`;
  const scanModel = r.scanner_model ? ` · scanner: ${r.scanner_model}${r.scanner_effort ? " (" + r.scanner_effort + ")" : ""}` : "";
  document.getElementById("refill").textContent =
    lastR + (r.next_run ? ` · next check in ${fmtDur(r.next_run - now)}` : "") + scanModel;

  const promo = s.promotion;
  document.getElementById("release").innerHTML = !promo ? "" : (() => {
    const pctToGo = Math.min(100, 100 * promo.waiting / Math.max(promo.threshold, 1));
    const state = promo.active
      ? `<span class="ok">PROMOTING NOW — dev → staging → main</span>`
      : promo.enabled
        ? (promo.waiting >= promo.threshold
            ? `<span class="warn">threshold reached — next hourly check promotes</span>`
            : `armed · promotes automatically at ${promo.threshold} commits`)
        : `<span class="dim">disabled — manual only (issue-pilot promote --now)</span>`;
    const last = promo.last
      ? `last release: ${esc(promo.last.outcome)} · ${fmtDur(now - promo.last.ts)} ago`
      : "no release recorded yet";
    return `<div class="card">
      <span class="name">production promotion</span><span class="kind">${promo.enabled ? "auto" : "manual"}</span>
      <div class="big">${promo.waiting} <span style="font-size:14px;color:var(--dim)">/ ${promo.threshold} commits</span></div>
      <div class="bar"><div class="fill" style="width:${pctToGo}%; background:${promo.active ? "var(--ok)" : "var(--accent)"}"></div></div>
      <div class="drift">${state}</div>
      <div class="row" style="margin-top:6px"><span>${last}</span></div>
    </div>`;
  })();

  const lanes = s.lanes || [];
  document.getElementById("lanes").innerHTML = lanes.length
    ? `<div class="card" style="padding:6px 16px"><table>
       <tr><th></th><th>lane</th><th>model</th><th>mode</th><th>state</th><th>current batch</th><th>total PRs</th></tr>` +
      lanes.map(l => {
        const on = l.concurrency > 0 && !l.disabled && !off;
        const batch = (on && l.batch_started)
          ? `${l.batch_done} done / ${Math.max(l.batch_target - l.batch_done, 0)} left of ${l.batch_target} picked · running ${fmtDur(now - l.batch_started)}`
          : "—";
        const model = l.model ? esc(l.model) + (l.effort ? ` <span class="kind">${esc(l.effort)}</span>` : "") : "—";
        const live = l.workers_live || 0;
        const state = l.disabled ? `<span class="dim">disabled</span>`
          : off ? `<span class="warn">paused</span>`
          : !on ? "idle"
          : live > 0 ? `<span class="ok">working · target ${l.concurrency} subagents</span>`
          : (s.refill && s.refill.ready === 0)
            ? `<span class="warn">wants ${l.concurrency} — queue empty</span>`
            : `starting · wants ${l.concurrency}`;
        return `<tr>
          <td><div class="toggle ${l.disabled ? "" : "on"}" onclick="this.classList.toggle('on'); api({action:'lane_toggle',id:'${esc(l.id)}'}, '${esc(l.label)} ${l.disabled ? "activated" : "deactivated"}')"></div></td>
          <td>${esc(l.label)}</td><td>${model}</td>
          <td><select onchange="api({action:'lane_mode',id:'${esc(l.id)}',mode:this.value}, '${esc(l.label)} mode → ' + this.value)">
            ${["always", "window"].concat(l.mode === "off" ? ["off"] : []).map(m => `<option${l.mode === m ? " selected" : ""}>${m}</option>`).join("")}
          </select></td>
          <td class="${on ? "ok" : ""}">${state}</td>
          <td>${batch}</td><td>${l.total_done}</td></tr>`;
      }).join("") + `</table>
      <div class="row" style="padding:10px 0 12px"><span class="dim">a lane = one agent (Claude, Codex, …) — deactivating one stops its running batch; its claimed issues keep the claim label until you remove it</span></div></div>`
    : `<div class="empty">no lanes configured</div>`;

  const camp = s.campaign;
  document.getElementById("campaignSec").innerHTML = (() => {
    const form = `<div id="newCamp" style="display:none;margin-top:12px">
        <textarea id="goalText" rows="3" placeholder="State the goal with a measurable definition of done — e.g. Every dashboard page is usable at 375px: no horizontal scroll, tap targets 44px+, mobile e2e for the main flows."></textarea>
        <div class="controls"><button class="primary" onclick="newCampaign()">Start campaign</button>
        <button onclick="document.getElementById('newCamp').style.display='none'">Cancel</button></div></div>`;
    if (!camp || !camp.goal || camp.status === "done") {
      const doneNote = camp && camp.goal && camp.status === "done"
        ? `<div class="drift ok">last campaign achieved: ${esc(camp.goal.split("\n")[0])}</div>` : "";
      return `<h2>Campaign</h2><div class="card">${doneNote}
        <div class="empty">no active campaign — give the system a goal and it works toward it until done</div>
        <div class="controls"><button class="primary" onclick="document.getElementById('newCamp').style.display='block'">+ New campaign</button></div>${form}</div>`;
    }
    const paused = camp.status === "paused";
    return `<h2>Campaign</h2><div class="card">
      <span class="name" style="font-weight:600;font-size:15px">${esc(camp.goal.split("\n")[0])}</span>
      <span class="kind ${paused ? "warn" : "ok"}">${paused ? "PAUSED" : "ACTIVE"}</span>
      <div class="big">${camp.closed} <span style="font-size:14px;color:var(--dim)">done</span>
        &nbsp;·&nbsp; ${camp.open} <span style="font-size:14px;color:var(--dim)">open gaps</span></div>
      ${camp.assessment ? `<div class="quote">${esc(camp.assessment)}</div>` : `<div class="drift dim">no assessment yet — first gap analysis pending</div>`}
      <div class="controls">
        <button onclick="api({action:'campaign_${paused ? "resume" : "pause"}'}, 'campaign ${paused ? "resumed" : "paused"}')">${paused ? "Resume" : "Pause"}</button>
        <button onclick="api({action:'campaign_done'}, 'campaign archived')">Mark done</button>
        <button class="primary" onclick="document.getElementById('newCamp').style.display='block'">+ New campaign</button>
      </div>${form}
      ${camp.history ? `<div class="drift dim" style="margin-top:8px">${esc(camp.history)}</div>` : ""}
    </div>`;
  })();

  const sc = s.scanners || [];
  document.getElementById("scanners").innerHTML = sc.length
    ? `<div class="card" style="padding:6px 16px"><table>
       <tr><th></th><th>scanner</th><th>model</th><th>last run</th><th>looks for</th><th></th></tr>` +
      sc.map(x => `<tr>
        <td><div class="toggle ${x.enabled ? "on" : ""}" onclick="this.classList.toggle('on'); api({action:'scanner_toggle',name:'${esc(x.name)}'}, '${esc(x.name)} ${x.enabled ? "disabled" : "enabled"}')"></div></td>
        <td>${esc(x.name)}${x.source && x.source !== "built-in" ? ` <span class="kind">${esc(x.source)}</span>` : ""}${x.queued_next ? ' <span class="kind warn">next</span>' : ""}</td>
        <td>${x.model ? `${esc(x.model)}${x.effort ? ` <span class="kind">${esc(x.effort)}</span>` : ""}` : "—"}</td>
        <td class="${x.enabled && x.last_run && (now - x.last_run) > 604800 ? "warn" : "dim"}">${x.last_run ? fmtDur(now - x.last_run) + " ago" + (x.last_filed != null ? ` · <span class="${x.last_filed > 0 ? "ok" : ""}">${x.last_filed} filed</span>` : "") : "never"}</td>
        <td class="dim">${esc(x.desc || "custom scanner")}</td>
        <td><button onclick="api({action:'scanner_run_next',name:'${esc(x.name)}'}, '${esc(x.name)} queued as next refill')">Run next</button></td>
      </tr>`).join("") + `</table>
      <div class="row" style="padding:10px 0 12px"><span class="dim">a scanner = one .md file — built-ins ship with issue-pilot, your own in <b>&lt;working-dir&gt;/scanners/</b> override them; enabled ones rotate strictly, one per refill</span></div></div>`
    : `<div class="empty">no scanners resolved</div>`;

  const res = s.resources;
  const diskGb = res && res.disk_free_mb ? res.disk_free_mb / 1024 : null;
  document.getElementById("resources").innerHTML = (res && res.budget > 0)
    ? `server resource budget: ${res.budget} workers (load ${esc(res.load5)} of ${res.cores} cores, ${(res.mem_mb/1024).toFixed(0)} GB RAM free` +
      (diskGb != null ? `, <span class="${diskGb < 10 ? "bad" : diskGb < 20 ? "warn" : ""}">${diskGb.toFixed(0)} GB disk free${diskGb < 10 ? " ⚠" : ""}</span>` : "") +
      `) — lanes are capped by what's left of this budget`
    : "";

  const w = s.workers || [];
  document.getElementById("workers").innerHTML = w.length
    ? "<table><tr><th>account</th><th>role</th><th>pid</th><th>running for</th></tr>" +
      w.map(p => `<tr><td>${esc(p.account)}</td><td>${p.role === "lane batch" ? esc(p.role) : `<span class="kind">${esc(p.role || "agent")}</span>`}</td><td>${p.pid}</td><td>${fmtDur(p.uptime_secs)}</td></tr>`).join("") + "</table>"
    : `<div class="empty">no agent sessions running</div>`;

  const c = s.claimed || [];
  document.getElementById("claimed").innerHTML = c.length
    ? "<table>" + c.map(i => `<tr><td><a href="${esc(i.url)}">#${i.number}</a></td><td>${esc(i.title)}</td></tr>`).join("") + "</table>"
    : `<div class="empty">nothing claimed</div>`;

  const p = s.recent_prs || [];
  document.getElementById("prs").innerHTML = p.length
    ? "<table>" + p.map(x => `<tr><td><a href="${esc(x.url)}">#${x.number}</a></td><td>${esc(x.title)}</td><td>${fmtDur(now - Math.floor(new Date(x.createdAt)/1000))} ago</td></tr>`).join("") + "</table>"
    : `<div class="empty">none</div>`;
}
refresh(); setInterval(refresh, 60000);
</script>
