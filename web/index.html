<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>issue-pilot — Mission Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1420; --card:#151d2c; --line:#24304a; --fg:#e8edf6; --dim:#8b97ad;
  --accent:#3ec98e; --gold:#d4a843; --bad:#e5636c; --warn:#e0a83e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(1100px 500px at 50% -120px,#16233a 0%,var(--bg) 65%) fixed,var(--bg);
  color:var(--fg); font:15px/1.55 "Sora",system-ui,-apple-system,sans-serif; padding-bottom:44px;
}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
.app{display:flex;min-height:calc(100vh - 44px);max-width:1180px;margin:0 auto}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}

.banner{display:flex;align-items:center;gap:10px;max-width:1180px;margin:0 auto;padding:9px 18px;
  background:rgba(224,168,62,.1);border:1px solid rgba(224,168,62,.4);border-top:none;
  border-radius:0 0 12px 12px;color:var(--warn);font-size:13.5px}
.banner svg{flex:none}
.banner .x{margin-left:auto;background:none;border:none;color:var(--warn);cursor:pointer;font:16px "Sora",sans-serif;padding:0 4px;opacity:.7}
.banner .x:hover{opacity:1}

/* rail */
.rail{width:260px;flex:none;border-right:1px solid var(--line);padding:28px 14px 20px;display:flex;flex-direction:column;gap:4px}
.brand{font-weight:700;font-size:15px;letter-spacing:.4px;padding:0 12px 18px;display:flex;align-items:center;gap:9px}
.brand svg{color:var(--accent)}
.rail-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;border:1px solid transparent;background:none;width:100%;text-align:left;color:var(--fg);font:inherit}
.rail-item:hover{background:rgba(255,255,255,.03)}
.rail-item.sel{background:var(--card);border-color:var(--line)}
.rail-item .nm{flex:1;font-size:14px}
.rail-item .st{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;color:var(--dim);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--dim)}
.dot.run{background:var(--accent);box-shadow:0 0 8px rgba(62,201,142,.5)}
.dot.gold{background:var(--gold);box-shadow:0 0 8px rgba(212,168,67,.45)}
.dot.warn{background:var(--warn)}
.dot.sm{width:7px;height:7px}
body.paused .dot{background:var(--dim)!important;box-shadow:none!important}
.rail-item.needs{margin-top:14px;border:1px solid rgba(224,168,62,.35);background:rgba(224,168,62,.07)}
.rail-item.needs .nm,.rail-item.needs .st{color:var(--warn)}
.rail-spacer{flex:1}
.pause-row{display:flex;align-items:center;justify-content:space-between;padding:12px;border-top:1px solid var(--line);margin-top:12px}
.pause-row span{font-size:13px;color:var(--dim)}
.switch{width:40px;height:22px;border-radius:11px;background:var(--line);border:none;cursor:pointer;position:relative;transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--fg);transition:left .15s}
.switch.on{background:var(--bad)}
.switch.on::after{left:21px}
.switch.sm{width:30px;height:17px}
.switch.sm::after{width:11px;height:11px}
.switch.sm.on::after{left:16px}
.switch.ok.on{background:var(--accent)}

/* pane */
.pane{flex:1;padding:34px 44px 60px;min-width:0}
.crumb{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:14px}
.headline{font-size:22px;font-weight:600;line-height:1.65;max-width:720px}
.now{margin-top:14px;font-size:13.5px;color:var(--dim);display:flex;align-items:center;gap:8px}
.now .pulse{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pu 1.6s infinite;flex:none}
body.paused .now .pulse{background:var(--dim);animation:none}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.3}}
.status-line{margin-top:8px;font-size:12.5px;color:var(--dim);font-family:"JetBrains Mono",ui-monospace,monospace;max-width:720px}
.status-line .warn{color:var(--warn)}
.status-line .ok{color:var(--accent)}

.preview{margin-top:24px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;padding:16px 18px;max-width:720px}
.preview h4{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent);margin-bottom:7px;display:flex;gap:7px;align-items:center}
.preview p{font-size:14px}
.preview p em{color:var(--gold);font-style:normal;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px}

.section{margin-top:30px;max-width:720px}
.section h3{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);margin-bottom:12px}
.rows{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.012)}
.row:last-child{border-bottom:none}
.row.off{opacity:.42}
.row .grow{flex:1;min-width:0}
.row .lbl{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px}
.row .sub{font-size:12px;color:var(--dim)}
.tag{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10px;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--dim);white-space:nowrap}
.tag.gold{color:var(--gold);border-color:rgba(212,168,67,.4)}
.hist{list-style:none;max-width:720px}

.today{display:flex;gap:22px;margin-top:20px;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px;max-width:720px;font-size:13px;color:var(--dim);flex-wrap:wrap}
.today b{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:600;color:var(--fg);margin-right:5px}

.disc{background:none;border:none;color:var(--dim);font:12.5px "JetBrains Mono",ui-monospace,monospace;cursor:pointer;padding:0;margin-top:10px;display:inline-flex;align-items:center;gap:6px}
.disc:hover{color:var(--accent)}
.disc .car{display:inline-block;transition:transform .15s}
.disc.open .car{transform:rotate(90deg)}
.procs{list-style:none;margin:10px 0 0;max-width:720px;border:1px solid var(--line);border-radius:12px;padding:6px 0;background:rgba(255,255,255,.012)}
.procs li{display:flex;align-items:center;gap:10px;padding:6px 16px;font:12.5px "JetBrains Mono",ui-monospace,monospace;color:var(--dim)}
.procs li b{color:var(--fg);font-weight:500}

/* chips */
.chip{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.86em;font-weight:500;color:var(--accent);background:none;border:1px solid transparent;border-bottom:1px dotted var(--accent);border-radius:2px;padding:1px 3px;cursor:pointer;line-height:inherit}
.chip:hover{background:rgba(62,201,142,.12);border-radius:999px;border:1px solid rgba(62,201,142,.4);padding:1px 9px}
.chip.gold{color:var(--gold);border-bottom-color:var(--gold)}
.chip.gold:hover{background:rgba(212,168,67,.12);border-color:rgba(212,168,67,.4)}
.chip.na{color:var(--dim);border-bottom-color:var(--dim)}

.btn{font:12.5px "Sora",sans-serif;font-weight:600;color:var(--fg);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:8px;padding:6px 13px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.warn:hover{border-color:var(--warn);color:var(--warn)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.confirm{border-color:var(--bad);color:var(--bad);background:rgba(229,99,108,.08)}
.btn.small{padding:4px 10px;font-size:11.5px}
textarea{width:100%;min-height:74px;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--fg);font:13.5px "Sora",sans-serif;padding:10px 12px;resize:vertical}
textarea:focus{outline:none;border-color:var(--accent)}

.bar{position:relative;height:6px;border-radius:3px;background:var(--line);overflow:visible;margin-top:6px;max-width:340px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.bar i.warn{background:var(--warn)}
.bar .pace{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.65}
.bar.sm{display:inline-block;height:4px;width:72px;margin:0 6px 1px 0;vertical-align:middle;overflow:hidden}
.bar.wide{max-width:720px;height:8px;overflow:hidden;margin-top:14px}

/* spend */
.machbar{display:flex;height:22px;border-radius:6px;overflow:hidden;border:1px solid var(--line);max-width:720px}
.machbar i{display:block;height:100%;min-width:2px}
.machleg{display:flex;gap:16px;flex-wrap:wrap;margin-top:9px;font:11.5px "JetBrains Mono",ui-monospace,monospace;color:var(--dim);max-width:720px}
.machleg .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.machleg b{color:var(--fg);font-weight:500}
.days{display:flex;gap:8px;align-items:flex-end;height:88px;max-width:440px;padding-top:30px}
.days .d{flex:1;position:relative;background:rgba(62,201,142,.35);border-radius:3px 3px 0 0;cursor:default;min-height:6px}
.days .d:hover,.days .d.cur{background:var(--accent)}
.days .d::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);background:#182238;border:1px solid var(--line);border-radius:7px;padding:4px 9px;font:11px "JetBrains Mono",ui-monospace,monospace;color:var(--fg);white-space:nowrap;opacity:0;pointer-events:none;transition:.12s;z-index:5}
.days .d:hover::after{opacity:1}
.fchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.btn.sel{border-color:var(--accent);color:var(--accent)}
.tokbadge{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11.5px;color:var(--dim);white-space:nowrap}

.pop{position:fixed;z-index:50;background:#182238;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.5);padding:8px;min-width:180px;display:none}
.pop.open{display:block}
.pop .grp{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);padding:7px 10px 3px}
.pop .opt{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;text-align:left;background:none;border:none;color:var(--fg);font:13px "JetBrains Mono",ui-monospace,monospace;padding:7px 10px;border-radius:7px;cursor:pointer}
.pop .opt:hover{background:rgba(62,201,142,.12)}
.pop .opt .tick{color:var(--accent);visibility:hidden}
.pop .opt.cur .tick{visibility:visible}

/* prompt modal */
.ghost{background:none;border:none;color:var(--dim);cursor:pointer;padding:3px 4px;display:flex;border-radius:6px;flex:none}
.ghost:hover{color:var(--accent);background:rgba(62,201,142,.1)}
.mback{position:fixed;inset:0;z-index:70;background:rgba(8,12,20,.72);display:flex;align-items:center;justify-content:center;padding:30px 20px}
.mbox{width:760px;max-width:100%;max-height:calc(100vh - 60px);background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.mhead{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 0}
.mhead h2{font-size:16px;font-weight:600;font-family:"JetBrains Mono",ui-monospace,monospace}
.mhead .src{color:var(--dim);font-weight:400;font-size:13px}
.mmeta{font:11.5px "JetBrains Mono",ui-monospace,monospace;color:var(--dim);margin-top:5px}
.mx{margin-left:auto;background:none;border:none;color:var(--dim);font:18px "Sora",sans-serif;cursor:pointer;padding:0 4px;line-height:1}
.mx:hover{color:var(--fg)}
.tabs{display:flex;gap:6px;padding:14px 20px 0}
.mbody{overflow:auto;padding:14px 20px 20px;margin-top:12px;border-top:1px solid var(--line)}
.mbody pre{font:13px/1.65 "JetBrains Mono",ui-monospace,monospace;white-space:pre-wrap;word-break:break-word;color:var(--fg)}
.mbody .mnote{font-size:13px;color:var(--dim)}
.mbody .cap{font:11.5px "JetBrains Mono",ui-monospace,monospace;color:var(--gold);margin-bottom:10px}
.varchip{display:inline-block;font:11.5px "JetBrains Mono",ui-monospace,monospace;color:var(--gold);background:rgba(212,168,67,.12);border:1px solid rgba(212,168,67,.4);border-radius:999px;padding:0 7px;line-height:1.5}
@media (max-width:700px){
  .mback{padding:0}
  .mbox{width:100%;height:100%;max-height:100%;border-radius:0;border:none}
}

#toast{position:fixed;bottom:58px;left:50%;transform:translate(-50%,16px);background:#182238;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:10px 18px;font-size:13.5px;box-shadow:0 12px 34px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.22s;z-index:60;display:flex;gap:9px;align-items:center;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast svg{color:var(--accent);flex:none}
#toast.err{border-left-color:var(--bad)} #toast.err svg{color:var(--bad)}

.tg-card{margin-top:16px;max-width:560px;background:#182238;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.tg-card .hd{font-size:12px;color:var(--gold);font-family:"JetBrains Mono",ui-monospace,monospace;margin-bottom:10px}
.tg-card pre{white-space:pre-wrap;font:14px/1.6 "Sora","Tajawal",sans-serif}
body.paused .headline,body.paused .now{opacity:.55}

.footbar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--card);border-top:1px solid var(--line);
  font:11.5px "JetBrains Mono",ui-monospace,monospace;color:var(--dim);padding:9px 0}
.footbar .in{max-width:1180px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

@media (max-width:900px){
  .app{flex-direction:column}
  .rail{width:100%;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:14px;align-items:center}
  .brand{padding:0 10px 0 0}
  .rail-item{width:auto;white-space:nowrap}
  .rail-item.needs{margin-top:0}
  .rail-spacer{display:none}
  .pause-row{border-top:none;margin:0;padding:0 8px}
  .pause-row span{display:none}
  .pane{padding:24px 18px 60px}
  .headline{font-size:19px}
}
</style>
</head>
<body>
<div id="banner"></div>
<div class="app">
  <nav class="rail" id="rail"></nav>
  <main class="pane" id="pane"><div class="crumb">loading…</div></main>
</div>
<footer class="footbar"><div class="in" id="foot"></div></footer>
<div class="pop" id="pop"></div>
<div id="modal"></div>
<div id="toast"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M2.5 8.5l3.5 3.5 7.5-8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="toastMsg"></span></div>

<script>
"use strict";
const WEEK = 604800, REPO = "https://github.com/kasbly/kasbly";
let S = null, NOW = 0;
const UI = { view:"scanner", confirmAct:null, procsOpen:false, noteOpen:false,
             newCampOpen:false, assessOpen:false, goalOpen:false, bannerGone:false,
             spendFilter:"All", promptName:null, promptTab:"tmpl", prompt:null };

/* ---------- helpers (esc/fmtDur kept from the previous page) ---------- */
const fmtDur = s => {
  if (s == null || s < 0 || isNaN(s)) return "–";
  const d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
};
const fmt = n => {
  if (n == null || !isFinite(n) || n <= 0) return "–";
  if (n < 1000) return String(Math.round(n));
  const [div, unit] = n < 1e6 ? [1e3, "k"] : [1e6, "M"];
  return (Math.round(n / div * 10) / 10).toFixed(1).replace(/\.0$/, "") + unit;
};
const spendRuns = () => ((S || {}).spend || {}).runs || [];
const lastRunOf = kind => spendRuns().find(r => r.kind === kind && r.tok > 0);
const tokBadge = r => r ? ` <span class="tokbadge">· last run ${fmt(r.tok)} tok</span>` : "";
const esc = t => { const e = document.createElement("span"); e.textContent = t ?? ""; return e.innerHTML; };
const escA = t => esc(t).replace(/"/g, "&quot;").replace(/'/g, "&#39;");
const ago = ts => ts ? fmtDur(NOW - ts) + " ago" : "–";
const dash = v => v == null ? `<span style="color:var(--dim)">–</span>` : esc(v);
const $ = s => document.querySelector(s);

let toastT;
function toast(msg, err) {
  $("#toastMsg").textContent = msg;
  $("#toast").className = "show" + (err ? " err" : "");
  clearTimeout(toastT); toastT = setTimeout(() => $("#toast").className = "", 2800);
}
async function api(payload, msg) {
  try {
    const res = await fetch("/api/action", { method:"POST", body: JSON.stringify(payload) });
    const out = await res.json();
    if (out.ok) { toast(msg); setTimeout(refresh, 2500); return true; }
    toast("couldn't save: " + (out.error || "unknown"), true);
  } catch { toast("couldn't save — API unreachable", true); }
  return false;
}

/* ---------- data-derived vocab ---------- */
const KNOWN_MODELS = ["grok-4.6","grok-4.5","fable","opus","sonnet","haiku","gpt-5.6-sol","gpt-5.6-terra"];
const EFFORTS = ["low","medium","high","xhigh","max"];
const modelFam = m => /^grok/.test(m) ? "Grok" : /^gpt/.test(m) ? "Codex" : "Claude";
const billFam  = m => /^grok/.test(m) ? "SuperGrok" : /^gpt/.test(m) ? "Codex" : "your Claude subscription";
function allModels() {                      // fixed list ∪ whatever the data mentions
  const seen = new Set(KNOWN_MODELS);
  (S.scanners||[]).forEach(x => x.model && seen.add(x.model));
  (S.lanes||[]).forEach(l => l.model && seen.add(l.model));
  const r = S.refill || {};
  [r.scanner_model, fallbackPair()[0]].forEach(m => m && seen.add(m));
  return [...seen];
}
/* ponytail: scanner_fallback is one string, sometimes "model/effort" (same shape as
   refill detail "via grok-4.6/high") — split only when the tail is a known effort */
function fallbackPair() {
  const f = (S.refill || {}).scanner_fallback;
  if (!f) return [null, null];
  const i = f.lastIndexOf("/");
  if (i > 0 && EFFORTS.includes(f.slice(i+1))) return [f.slice(0, i), f.slice(i+1)];
  return [f, null];
}
const flat = a => [{ items: a.map(v => ({ v, label: String(v) })) }];
const POPS = {
  model:  () => ["Grok","Claude","Codex"].map(f =>
            ({ grp: f, items: allModels().filter(m => modelFam(m) === f).map(v => ({ v, label: v })) }))
            .filter(g => g.items.length),
  effort: () => flat(EFFORTS),
  laneMode: () => flat(["always on","follow my pace","off"]),
  promoteAfter: cur => flat([...new Set([25,50,75,100,150, cur].filter(v => typeof v === "number"))].sort((a,b)=>a-b)),
  refillThresh: cur => flat([...new Set([10,20,30,40,50, cur].filter(v => typeof v === "number"))].sort((a,b)=>a-b)),
  batch: cur => flat([...new Set([1,2,3,5,10,25, cur].filter(v => typeof v === "number"))].sort((a,b)=>a-b)),
};

/* ---------- popover-apply handlers ---------- */
const APPLY = {
  scanModel:  (a,v) => api({ action:"scanner_model",  name:a.name, model:v },  `${a.name} model → ${v} — takes effect next run`),
  scanEffort: (a,v) => api({ action:"scanner_effort", name:a.name, effort:v }, `${a.name} effort → ${v} — takes effect next run`),
  setting:    (a,v) => api({ action:"setting", key:a.key, value:String(v) }, "Saved — takes effect next run"),
  laneMode: async (a,v) => {
    if (v === "off") {
      if (a.disabled) return toast(`${a.label} is already off`);
      return api({ action:"lane_toggle", id:a.id }, `${a.label} switched off — its running batch stops`);
    }
    if (a.disabled && !await api({ action:"lane_toggle", id:a.id }, `${a.label} switched back on`)) return;
    api({ action:"lane_mode", id:a.id, mode: v === "always on" ? "always" : "window" },
        `${a.label} mode → ${v}`);
  },
};

/* chip: value + popover kind + apply args. null value renders as dim "–" but stays editable */
function chip(val, pop, arg, gold) {
  const v = val == null ? "–" : String(val);
  return `<button class="chip${gold ? " gold" : ""}${val == null ? " na" : ""}" data-pop="${pop}"
    data-cur="${escA(v)}" data-arg="${escA(JSON.stringify(arg))}">${esc(v)}</button>`;
}
function previewBox(text) {
  return `<div class="preview"><h4><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 1.5v3M8 11.5v3M1.5 8h3M11.5 8h3"/><circle cx="8" cy="8" r="2.4"/></svg>Effect preview</h4><p>${text}</p></div>`;
}

/* ---------- rail ---------- */
function railData() {
  const r = S.refill || {}, promo = S.promotion || {}, camp = S.campaign || {}, ann = S.announce || {};
  const live = (S.lanes||[]).reduce((n,l) => n + (l.workers_live || 0), 0);
  const resting = (S.accounts||[]).filter(a => {
    if (a.used_pct == null || !a.resets_at) return false;
    const exp = Math.max(0, Math.min(100, 100 * (1 - (a.resets_at - NOW)/WEEK)));
    return a.used_pct > exp;
  }).length;
  return [
    { id:"scanner", nm:"Scanner", dot: S.paused ? "" : "run",
      st: r.next_run ? "in " + fmtDur(r.next_run - NOW) : (r.last ? r.last.action : "–") },
    { id:"workers", nm:"Workers", dot: live > 0 ? "run" : "", st: `${live} active` },
    { id:"release", nm:"Release", dot: promo.active ? "gold" : "",
      st: promo.active ? "promoting" : `${promo.waiting ?? "–"}/${promo.threshold ?? "–"}` },
    { id:"campaign", nm:"Campaign", dot: camp.status === "active" ? "run" : "", st: camp.status || "none" },
    { id:"tenant", nm:"Tenant note", dot: ann.pending ? "warn" : "",
      st: !ann.enabled ? "off" : ann.pending ? "retry pending" : "idle" },
    { id:"spend", nm:"Spend",
      icon:'<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1.5 14h13"/><path d="M3.5 14v-4.2M7 14V6.2M10.5 14V8M14 14V3.5"/></svg>',
      st: (S.spend || {}).today_tok > 0 ? fmt(S.spend.today_tok) + " today" : "–" },
    { id:"accounts", nm:"Accounts", dot: resting > 0 ? "warn" : "", st: resting > 0 ? `${resting} resting` : "on pace" },
  ];
}
function renderRail() {
  const blocked = (S.refill || {}).blocked_issues;
  $("#rail").innerHTML = `
    <div class="brand"><svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.8" y="1.8" width="12.4" height="12.4" rx="3"/><path d="M5.2 8.4l2 2 3.6-4.4"/></svg> issue-pilot</div>
    ${railData().map(m => `
    <button class="rail-item${UI.view === m.id ? " sel" : ""}" data-view="${m.id}">
      ${m.icon ? `<span style="display:flex;color:var(--gold)">${m.icon}</span>` : `<span class="dot ${m.dot}"></span>`}<span class="nm">${m.nm}</span>
      <span class="st">${S.paused && m.id !== "spend" ? "paused" : esc(m.st)}</span>
    </button>`).join("")}
    <button class="rail-item needs${UI.view === "needs" ? " sel" : ""}" data-view="needs">
      <span style="color:var(--warn);display:flex"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 1.8L15 13.8H1L8 1.8z"/><path d="M8 6.5v3.2"/></svg></span>
      <span class="nm">Needs you</span><span class="st">${blocked ?? "–"} blocked</span>
    </button>
    <div class="rail-spacer"></div>
    <div class="pause-row"><span>Pause everything</span>
      <button class="switch${S.paused ? " on" : ""}" data-act="masterPause" aria-label="Pause everything"></button>
    </div>`;
}

/* ---------- panes ---------- */
function scannerPane() {
  const r = S.refill || {}, sc = S.scanners || [];
  const enabled = sc.filter(x => x.enabled);
  const next = sc.find(x => x.queued_next && x.enabled) || enabled[0];
  const preview = next
    ? `Next <em>${esc(next.name)}</em> scan: ${esc(next.model ?? "–")}${next.effort ? ` (${esc(next.effort)})` : ""}, billed to ${billFam(next.model || "")}; runs when the queue drops under ${r.threshold ?? "–"} ready issues (now ${r.ready ?? "–"}).`
    : "No scanner enabled — the queue will not refill.";
  const rows = sc.map(x => `
    <div class="row${x.enabled ? "" : " off"}" title="${escA(x.desc || "")}">
      <button class="switch sm ok${x.enabled ? " on" : ""}" data-act="scanToggle" data-name="${escA(x.name)}" aria-label="Toggle ${escA(x.name)}"></button>
      <div class="grow"><span class="lbl">${esc(x.name)}</span>
        ${x.queued_next ? ` <span class="tag gold">next up</span>` : ""}
        ${x.source && x.source !== "built-in" ? ` <span class="tag">${esc(x.source)}</span>` : ""}
        <div class="sub">${[
          x.last_run != null ? "last ran " + ago(x.last_run) : "never ran",
          x.last_filed != null ? "filed " + esc(x.last_filed) : null,
          x.last_focus ? "focus " + esc(x.last_focus) : null,
          x.interval ? "every ≥" + esc(x.interval) : null,
        ].filter(Boolean).join(" · ")}</div></div>
      ${chip(x.model, "model",  { k:"scanModel",  name:x.name })}
      ${chip(x.effort, "effort", { k:"scanEffort", name:x.name })}
      <button class="ghost" data-act="viewPrompt" data-name="${escA(x.name)}" title="view prompt" aria-label="View ${escA(x.name)} prompt"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 1.5h5.5L13 5v9.5H4z"/><path d="M9.5 1.5V5H13"/><path d="M6 8h4M6 10.5h4"/></svg></button>
      <button class="btn small" data-act="runNext" data-name="${escA(x.name)}">Run next</button>
      <button class="btn small" data-act="runNow" data-name="${escA(x.name)}">Run now</button>
    </div>`).join("");
  const last = r.last
    ? `Last check ${ago(r.last.ts)} — ${r.last.action === "deferred"
        ? `<span class="warn">deferred — no Claude account behind its pace line</span>`
        : esc(r.last.action)}${r.last.detail ? ` (${esc(r.last.detail)})` : ""}`
    : "No refill check recorded yet";
  return `
    <div class="crumb">Scanner · issue finder</div>
    <div class="headline">Rotating through ${enabled.length} scan dimension${enabled.length === 1 ? "" : "s"}${next ? `, next up <span class="chip gold" style="cursor:default;border-bottom:none">${esc(next.name)}</span>` : ""} · scans when the queue drops under ${chip(r.threshold, "refillThresh", { k:"setting", key:"REFILL_THRESHOLD" })} ready issues.</div>
    <div class="now"><span class="pulse"></span>Right now: ${S.paused ? "paused by you"
      : r.ready != null && r.threshold != null
        ? (r.ready < r.threshold ? `queue low — ${r.ready} ready of ${r.threshold} wanted, refill eligible`
                                 : `waiting for the queue to drop (${r.ready} ready of ${r.threshold} wanted)`)
        : "–"}${tokBadge(lastRunOf("scanner"))}</div>
    <div class="status-line">${last}${r.next_run ? ` · next check in ${fmtDur(r.next_run - NOW)}` : ""}${r.scanner_model ? ` · default ${esc(r.scanner_model)}${r.scanner_effort ? ` (${esc(r.scanner_effort)})` : ""}` : ""}</div>
    ${previewBox(preview)}
    <div class="section"><h3>Dimensions</h3><div class="rows">${rows || `<div class="row"><span class="sub">no scanners resolved</span></div>`}</div>
      <p class="sub" style="margin-top:10px;color:var(--dim)">a scanner = one .md file — your own in &lt;working-dir&gt;/scanners/ override built-ins; enabled ones rotate strictly, one per refill</p></div>
    <div class="section"><h3>Fallback</h3>
      <p style="font-size:14.5px">When Claude rests: ${chip(fallbackPair()[0], "model", { k:"setting", key:"SCANNER_FALLBACK_MODEL" })} (${chip(fallbackPair()[1], "effort", { k:"setting", key:"SCANNER_FALLBACK_EFFORT" })}).</p>
    </div>`;
}

function workersPane() {
  const lanes = S.lanes || [], t = S.throughput || {}, r = S.refill || {}, w = S.workers || [];
  const live = lanes.reduce((n,l) => n + (l.workers_live || 0), 0);
  const preview = `<em>${live}</em> live worker${live === 1 ? "" : "s"}; each new batch takes <em>${r.batch_size ?? "–"}</em> issues. Merged ${t.merged_today ?? "–"} PRs today vs ${t.merged_yesterday ?? "–"} yesterday${r.ready != null ? `; ${r.ready} issues ready to pick up` : ""}.`;
  const rows = lanes.map(l => {
    const off = l.disabled || l.mode === "off";
    const running = !off && (l.workers_live || 0) > 0 && l.batch_started;
    const batch = running
      ? `batch: ${l.batch_done ?? 0} done of ${l.batch_target ?? "–"} · running ${fmtDur(NOW - l.batch_started)}`
      : "idle";
    const laneRun = spendRuns().find(x => x.kind === "lane" && x.tok > 0 && (x.detail === l.id || x.detail === l.label));
    return `
    <div class="row${off ? " off" : ""}">
      <span class="dot ${running ? "run" : ""}"></span>
      <div class="grow"><span class="lbl">${esc(l.label)}</span>
        <span class="sub mono" style="margin-left:8px">${l.model ? esc(l.model) + (l.effort ? ` (${esc(l.effort)})` : "") : "–"}</span>
        <div class="sub">${batch}${l.workers_live != null ? ` · ${l.workers_live} of ${l.concurrency ?? "–"} workers live` : ""} · ${l.total_done ?? "–"} PRs all-time${tokBadge(laneRun)}</div>${l.disabled && l.disabled_reason ? `<div class="sub" style="color:var(--warn)">${esc(l.disabled_reason)}</div>` : ""}</div>
      ${chip(off ? "off" : l.mode === "always" ? "always on" : "follow my pace", "laneMode",
             { k:"laneMode", id:l.id, label:l.label, disabled: !!l.disabled }, true)}
    </div>`; }).join("");
  const procs = UI.procsOpen ? `<ul class="procs">${w.map(p => {
      const role = p.role || "agent";
      const c = /promot|release/i.test(role) ? "gold" : /scan/i.test(role) ? "warn" : "run";
      return `<li><span class="dot sm ${c}"></span><span><b>${esc(role)}</b> (${esc(p.account)}) · pid ${esc(p.pid)} · ${fmtDur(p.uptime_secs)}</span></li>`;
    }).join("") || `<li><span class="sub">no agent sessions running</span></li>`}</ul>` : "";
  const roles = S.claude_roles;
  const permRow = (key, label) => `
    <div class="row"><span class="grow" style="font-size:13.5px">${label}</span>
      <button class="switch sm ok${roles[key] ? " on" : ""}" data-act="role" data-role="${key}" aria-label="${label}"></button></div>`;
  return `
    <div class="crumb">Workers · issue lanes</div>
    <div class="headline">Working the issue queue in priority order — each worker takes ${chip(r.batch_size, "batch", { k:"setting", key:"BATCH_SIZE" })} issues per batch.</div>
    <div class="now"><span class="pulse"></span>Right now: ${S.paused ? "paused by you" : live > 0 ? `${live} agent session${live === 1 ? "" : "s"} running` : "idle — no live workers"}</div>
    <button class="disc${UI.procsOpen ? " open" : ""}" data-act="toggleProcs"><span class="car">▸</span>${w.length} live process${w.length === 1 ? "" : "es"}</button>
    ${procs}
    <div class="today"><span><b>${t.merged_today ?? "–"}</b>PRs merged today</span><span><b>${t.merged_yesterday ?? "–"}</b>yesterday</span><span><b>${r.open_issues ?? "–"}</b>issues open</span></div>
    ${previewBox(preview)}
    <div class="section"><h3>Lanes (priority order)</h3><div class="rows">${rows || `<div class="row"><span class="sub">no lanes configured</span></div>`}</div>
      <p class="sub" style="margin-top:10px;color:var(--dim)">a lane = one agent account — switching one off stops its running batch. Model and effort are pinned per engine, not editable here.</p></div>
    ${roles ? `<div class="section"><h3>Claude permissions</h3><div class="rows">
      ${permRow("issues", "Claude works on issues")}
      ${permRow("scanner", "Claude runs scans")}
      ${permRow("promote", "Claude runs promotion rounds")}
    </div></div>` : ""}`;
}

function releasePane() {
  const p = S.promotion || {}, t = S.throughput || {};
  const pct = p.threshold ? Math.min(100, 100 * (p.waiting || 0) / p.threshold) : 0;
  const rate = (t.merged_today && p.threshold) ? t.merged_today / p.threshold : null;
  const preview = rate != null
    ? `At today's merge rate (~${t.merged_today}/day) you'd release ~<em>${(Math.round(rate*10)/10)}×</em> per day. ${p.waiting >= p.threshold ? "Threshold reached — the next hourly check promotes." : `${p.threshold - (p.waiting||0)} more commits until the next automatic run.`}`
    : `No merges recorded today — release cadence unknown.`;
  const confirming = UI.confirmAct === "promote";
  return `
    <div class="crumb">Release · production promotion</div>
    <div class="headline">Release to production after ${chip(p.threshold, "promoteAfter", { k:"setting", key:"PROMOTE_AFTER_COMMITS" })} new commits — ${p.waiting ?? "–"} waiting · using ${chip(p.model, "model", { k:"setting", key:"PROMOTE_MODEL" })} (${chip(p.effort, "effort", { k:"setting", key:"PROMOTE_EFFORT" })})${p.enabled === false ? ` <span class="tag">auto off — manual only</span>` : ""}.</div>
    <div class="now"><span class="pulse" style="background:${p.active ? "var(--gold)" : "var(--accent)"}"></span>Right now: ${S.paused ? "paused by you" : p.active ? "PROMOTING — dev → staging → main" : p.waiting >= p.threshold ? "threshold reached — next hourly check promotes" : "armed, counting commits"}${tokBadge(lastRunOf("promotion"))}</div>
    <div class="status-line">${p.last ? `last release: <span class="${p.last.outcome === "succeeded" ? "ok" : "warn"}">${esc(p.last.outcome)}</span> · ${ago(p.last.ts)}` : "no release recorded yet"}</div>
    <div class="bar wide"><i style="width:${pct}%;background:${p.active ? "var(--gold)" : "var(--accent)"}"></i></div>
    ${previewBox(preview)}
    ${p.active ? "" : `<div class="section">
      <button class="btn warn${confirming ? " confirm" : ""}" data-act="promote">${confirming ? `Click again to confirm — promote ${p.waiting ?? "?"} commits to PRODUCTION now` : "Promote now"}</button>
    </div>`}
    <div class="section"><h3>Announce</h3>${announceBlock()}</div>`;
}

function announceBlock() {
  const a = S.announce;
  if (!a || !a.enabled) return `<div class="status-line">release notes are disabled</div>`;
  const posting = UI.confirmAct === "postNote";
  const last = a.last
    ? `last: <span class="${a.last.outcome === "posted" ? "ok" : ""}">${esc(a.last.outcome)}</span> ${ago(a.last.ts)} · ${a.last.commits ?? "–"} changes`
    : "nothing posted yet";
  return `
    <div class="status-line" style="margin:0 0 12px">${last}${a.pending ? ` · <span class="warn">pending — retry on next hourly tick</span>` : ""}</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" data-act="genPreview">Generate preview</button>
      ${a.preview ? `<button class="btn" data-act="toggleNote">${UI.noteOpen ? "Hide last note" : `Show last note · ${ago(a.preview.ts)}`}</button>` : ""}
      <button class="btn warn${posting ? " confirm" : ""}" data-act="postNote">${posting ? "This sends a Telegram message to all tenants — click again to send" : "Post note now"}</button>
    </div>
    ${UI.noteOpen && a.preview ? `<div class="tg-card"><div class="hd">last generated note</div><pre dir="auto">${esc(a.preview.text)}</pre></div>` : ""}`;
}

function campaignPane() {
  const c = S.campaign || {};
  const form = UI.newCampOpen ? `
      <textarea id="goalText" placeholder="State the goal with a measurable definition of done — e.g. Every dashboard page is usable at 375px: no horizontal scroll, tap targets 44px+."></textarea>
      <div style="margin-top:10px;display:flex;gap:10px"><button class="btn" data-act="startCampaign">Start campaign</button>
      <button class="btn" data-act="cancelCampaign">Cancel</button></div>`
    : `<button class="btn" data-act="newCampaign">Start a new campaign</button>`;
  if (!c.goal || c.status === "done" || c.status === "none") {
    return `
    <div class="crumb">Campaign · goal loop</div>
    <div class="headline" style="color:var(--dim)">${c.goal && c.status === "done" ? `Last campaign achieved: ${esc(c.goal.split("\n")[0])}` : "No active campaign — give the system a goal and it works toward it until done."}</div>
    <div class="section">${form}</div>
    ${c.history ? `<div class="status-line">${esc(c.history)}</div>` : ""}`;
  }
  const paused = c.status === "paused";
  const goalLine = c.goal.length > 300 && !UI.goalOpen ? esc(c.goal.slice(0, 300)) + "… " : esc(c.goal);
  const preview = `${c.closed ?? "–"} gaps closed, ${c.open ?? "–"} open. ${paused ? "Paused — no more gap checks until you resume." : "Each check re-assesses the goal and files issues for the biggest gap."}`;
  return `
    <div class="crumb">Campaign · goal loop</div>
    <div class="headline">${goalLine}${c.goal.length > 300 ? `<button class="disc${UI.goalOpen ? " open" : ""}" data-act="toggleGoal" style="margin-left:6px"><span class="car">▸</span>${UI.goalOpen ? "less" : "full goal"}</button>` : ""}</div>
    <div class="now"><span class="pulse"></span>Right now: ${S.paused || paused ? "paused" : `active · ${c.closed ?? "–"} done / ${c.open ?? "–"} open gaps`}${tokBadge(lastRunOf("campaign"))}</div>
    ${previewBox(preview)}
    ${c.assessment ? `<div class="section"><button class="disc${UI.assessOpen ? " open" : ""}" data-act="toggleAssess"><span class="car">▸</span>latest assessment</button>
      ${UI.assessOpen ? `<div class="tg-card" style="margin-top:10px"><pre dir="auto">${esc(c.assessment)}</pre></div>` : ""}</div>`
      : `<div class="status-line">no assessment yet — first gap analysis pending</div>`}
    <div class="section" style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" data-act="pauseCampaign" data-paused="${paused ? 1 : ""}">${paused ? "Resume campaign" : "Pause campaign"}</button>
      <button class="btn danger" data-act="doneCampaign">Mark done</button>
    </div>
    <div class="section">${form}</div>
    ${c.history ? `<div class="status-line">${esc(c.history)}</div>` : ""}`;
}

function tenantPane() {
  const a = S.announce || {};
  return `
    <div class="crumb">Tenant note · release announcements</div>
    <div class="headline">${a.enabled ? "After each release, post a short summary to the tenants' Telegram · skips internal-only releases." : "Release notes are disabled."}</div>
    <div class="now"><span class="pulse" style="${a.pending ? "background:var(--warn)" : "background:var(--dim);animation:none"}"></span>Right now: ${a.pending ? "retry pending — next hourly tick" : a.last ? `idle — last ${esc(a.last.outcome)} ${ago(a.last.ts)}` : "idle — nothing posted yet"}${tokBadge(lastRunOf("note"))}</div>
    ${previewBox(a.last ? `Last note ${esc(a.last.outcome)} ${ago(a.last.ts)} covering <em>${a.last.commits ?? "–"}</em> changes. Posting now sends everything shipped since then.` : "Nothing posted yet — the first note covers everything shipped so far.")}
    <div class="section">${announceBlock()}</div>`;
}

const KIND_LABEL = { scanner:"Scanners", lane:"Workers", promotion:"Release", campaign:"Campaign", note:"Tenant note" };
const RUN_LABEL  = { scanner:"Scanner", lane:"Worker batch", promotion:"Release", campaign:"Campaign", note:"Tenant note" };
const KIND_HEAD  = { scanner:"the scanners", lane:"the workers", promotion:"the release", campaign:"the campaign", note:"tenant notes" };
const KIND_COLOR = { scanner:"rgba(62,201,142,.85)", promotion:"rgba(212,168,67,.85)", lane:"rgba(212,168,67,.42)", campaign:"rgba(62,201,142,.42)", note:"rgba(139,151,173,.6)" };

function spendPane() {
  const sp = S.spend || {};
  const today = sp.today_tok || 0;
  const kinds = Object.entries(sp.by_kind || {}).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  const kindSum = kinds.reduce((n, [, v]) => n + v, 0);
  const headline = today > 0
    ? `The fleet spent <span class="mono" style="color:var(--gold)">${fmt(today)}</span> tokens today${kinds.length ? ` — most of it on ${esc(KIND_HEAD[kinds[0][0]] || kinds[0][0])} (${fmt(kinds[0][1])})` : ""}.`
    : `No AI runs recorded yet today — the ledger started 2026-08-30.`;
  const machine = kinds.length ? `
    <div class="section"><h3>Today by machine</h3>
      <div class="machbar">${kinds.map(([k, v]) =>
        `<i style="width:${(100 * v / kindSum).toFixed(1)}%;background:${KIND_COLOR[k] || "var(--dim)"}" title="${escA(KIND_LABEL[k] || k)} ${escA(fmt(v))}"></i>`).join("")}</div>
      <div class="machleg">${kinds.map(([k, v]) =>
        `<span><span class="sw" style="background:${KIND_COLOR[k] || "var(--dim)"}"></span>${esc(KIND_LABEL[k] || k)} <b>${fmt(v)}</b></span>`).join("")}</div>
    </div>` : "";
  const engines = Object.entries(sp.by_engine || {}).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  const engine = engines.length ? `
    <div class="section"><h3>Today by engine</h3><div class="rows">${engines.map(([k, v]) => `
      <div class="row" style="padding:9px 16px">
        <span class="lbl" style="flex:none;width:150px">${esc(k)}</span>
        <span class="mono" style="font-size:13px;flex:none">${fmt(v)}</span>
      </div>`).join("")}</div></div>` : "";
  const days = sp.days || [];
  const dayMax = Math.max(1, ...days.map(d => d.tok || 0));
  const week = days.some(d => d.tok > 0) ? `
    <div class="section"><h3>Last 7 days</h3>
      <div class="days">${days.map((d, i) =>
        `<div class="d${i === days.length - 1 ? " cur" : ""}" style="height:${Math.round(100 * (d.tok || 0) / dayMax)}%" data-tip="${escA(d.d)} — ${d.tok > 0 ? escA(fmt(d.tok)) : "0"}"></div>`).join("")}</div>
    </div>` : "";
  const runs = sp.runs || [];
  const presentKinds = [...new Set(runs.map(r => r.kind).filter(Boolean))];
  const filter = UI.spendFilter === "All" || presentKinds.includes(UI.spendFilter) ? UI.spendFilter : "All";
  const chips = ["All", ...presentKinds].map(f =>
    `<button class="btn small${filter === f ? " sel" : ""}" data-act="spendFilter" data-f="${escA(f)}">${esc(f === "All" ? "All" : KIND_LABEL[f] || f)}</button>`).join("");
  const runRows = runs.filter(r => filter === "All" || r.kind === filter).map(r => {
    const t = r.ts ? new Date(r.ts * 1000).toLocaleTimeString([], { hour:"numeric", minute:"2-digit" }) : "–";
    const io = `in ${r.in > 0 ? fmt(r.in) : "0"} · cached ${r.cached > 0 ? fmt(r.cached) : "0"} · out ${r.out > 0 ? fmt(r.out) : "0"}`;
    return `
    <div class="row" style="padding:8px 14px">
      <span class="mono" style="font-size:12px;color:var(--dim);flex:none;width:64px">${esc(t)}</span>
      <span class="grow" style="font-size:13px">${esc(RUN_LABEL[r.kind] || r.kind || "run")}${r.detail ? " — " + esc(r.detail) : ""}</span>
      <span class="mono" style="font-size:11.5px;color:var(--dim);flex:none">${esc(r.model || r.engine || "–")}</span>
      <span class="mono" style="font-size:12px;color:var(--dim);flex:none;width:48px;text-align:right">${fmtDur(r.secs)}</span>
      <span class="mono" style="font-size:12.5px;flex:none;width:52px;text-align:right" title="${escA(io)}">${fmt(r.tok)}</span>
    </div>`;
  }).join("");
  const recent = runs.length ? `
    <div class="section"><h3>Recent runs</h3>
      <div class="fchips">${chips}</div>
      <div class="rows">${runRows || `<div class="row"><span class="sub">no runs in this category</span></div>`}</div>
    </div>` : "";
  return `
    <div class="crumb">Spend · token cost</div>
    <div class="headline">${headline}</div>
    ${machine}${engine}${week}${recent}`;
}

function accountsPane() {
  const rows = (S.accounts || []).map(a => {
    const secs = a.resets_at ? a.resets_at - NOW : null;
    const expected = secs != null ? Math.max(0, Math.min(100, 100 * (1 - secs/WEEK))) : null;
    const drift = (a.used_pct != null && expected != null) ? expected - a.used_pct : null;
    const cls = drift == null ? "dim" : drift > 10 ? "warn" : drift < -10 ? "bad" : "ok";
    const driftTxt = a.no_usage_api ? (a.connected ? "connected — no usage API" : "not logged in")
      : drift == null ? "no data"
      : Math.abs(drift) < 1 ? "on pace"
      : drift > 0 ? `${drift.toFixed(0)}% behind pace` : `${(-drift).toFixed(0)}% ahead of pace`;
    const h5 = a.five_hour_pct != null
      ? `<div class="sub" style="margin-top:4px${a.five_hour_pct >= 85 ? ";color:var(--warn)" : ""}">5h window: <span class="bar sm"><i class="${a.five_hour_pct >= 85 ? "warn" : ""}" style="width:${a.five_hour_pct}%"></i></span>${a.five_hour_pct.toFixed(0)}%${a.five_hour_pct >= 85 ? " — near cap" : ""}</div>` : "";
    const stale = a.kind === "codex" && a.stale_secs > 3600 ? ` · snapshot ${fmtDur(a.stale_secs)} old` : "";
    return `
    <div class="row" style="align-items:flex-start;padding:14px 16px">
      <div class="grow"><span class="lbl">${esc(a.name)}</span> <span class="tag">${esc(a.kind)}</span>
        ${a.no_usage_api ? `<div class="sub" style="margin-top:6px">${a.connected ? "connected — no usage API" : "not logged in"}</div>`
          : `<div class="bar"><i class="${drift != null && drift < -10 ? "warn" : ""}" style="width:${a.used_pct ?? 0}%"></i>
             ${expected != null ? `<span class="pace" style="left:${expected}%" title="ideal pace ${expected.toFixed(0)}%"></span>` : ""}</div>`}
        <div class="sub" style="margin-top:6px">resets in ${fmtDur(secs)}${esc(stale)}</div></div>
      <div style="text-align:right;flex:none">
        <div class="lbl">${a.used_pct != null ? a.used_pct.toFixed(1) + "%" : a.no_usage_api ? (a.connected ? "✓" : "✗") : "–"}</div>
        <div class="sub" style="color:var(--${cls === "ok" ? "accent" : cls === "dim" ? "dim" : cls})">${driftTxt}</div>
        ${h5}
      </div>
    </div>`; }).join("");
  const resting = (S.accounts || []).filter(a => a.used_pct != null && a.resets_at &&
    a.used_pct > Math.max(0, Math.min(100, 100 * (1 - (a.resets_at - NOW)/WEEK)))).length;
  return `
    <div class="crumb">Accounts · subscription pace</div>
    <div class="headline">${(S.accounts||[]).length} subscription${(S.accounts||[]).length === 1 ? "" : "s"} paced across the billing period — lanes rest when a subscription runs ahead.</div>
    <div class="now"><span class="pulse" style="background:${resting > 0 ? "var(--warn)" : "var(--accent)"}"></span>Right now: ${resting > 0 ? `${resting} account${resting === 1 ? " is" : "s are"} ahead of pace and resting` : "everyone is on or behind pace"}</div>
    ${previewBox("Nothing to change here — pace targets come from each plan's billing period. The white tick on each bar is the ideal-pace line.")}
    <div class="section"><h3>Subscriptions</h3><div class="rows">${rows || `<div class="row"><span class="sub">no accounts configured</span></div>`}</div></div>`;
}

function needsPane() {
  const r = S.refill || {};
  const list = r.blocked_list || [];
  const rows = list.map(b => `
    <div class="row">
      <a class="lbl" style="color:var(--warn);flex:none" href="${REPO}/issues/${encodeURIComponent(b.number)}" target="_blank" rel="noopener">#${esc(b.number)}</a>
      <span class="grow" style="font-size:13.5px">${esc(b.title)}</span>
    </div>`).join("");
  return `
    <div class="crumb" style="color:var(--warn)">Needs you · blocked work</div>
    <div class="headline">${r.blocked_issues ?? "–"} issue${r.blocked_issues === 1 ? "" : "s"} the fleet can't move without you.</div>
    <div class="now">These are parked — no worker will touch them until you unblock or close them on GitHub.</div>
    <div class="section"><div class="rows">${rows || `<div class="row"><span class="sub">${r.blocked_list ? "nothing blocked" : "–"}</span></div>`}</div>
      <p class="sub" style="margin-top:10px"><a href="${REPO}/issues?q=is%3Aissue+is%3Aopen+label%3Astatus%2Fblocked" target="_blank" rel="noopener">view all blocked issues on GitHub →</a></p></div>`;
}

const PANES = { scanner:scannerPane, workers:workersPane, release:releasePane,
                campaign:campaignPane, tenant:tenantPane, spend:spendPane,
                accounts:accountsPane, needs:needsPane };

/* ---------- prompt modal ---------- */
const highlightVars = t => esc(t).replace(/\$\{?[A-Z_][A-Z0-9_]*\}?/g, m => `<span class="varchip">${m}</span>`);
/* ponytail: sent snapshots start with "<!-- sent <iso> · <model>/<effort> · <file> -->" — parse on raw text, insert only escaped pieces */
function sentParts(sent) {
  const m = sent.match(/^<!--\s*sent\s+(\S+)\s*·\s*(\S+)\s*·\s*(\S+)\s*-->\r?\n?/);
  if (!m) return { cap: null, body: sent };
  const when = m[1].replace("T", " ").replace(/(:\d\d):\d\d(?:\.\d+)?Z$/, "$1 UTC");
  return { cap: `captured ${when} · ${m[2]}`, body: sent.slice(m[0].length) };
}
function promptModal() {
  const name = UI.promptName;
  if (name == null) return "";
  const p = UI.prompt, sc = (S.scanners || []).find(x => x.name === name) || {};
  const model = (p && p.model) || sc.model, effort = (p && p.effort) || sc.effort;
  let body;
  if (!p) body = `<div class="mnote">loading…</div>`;
  else if (p.error) body = `<div class="mnote">couldn't load prompt — API unreachable</div>`;
  else if (UI.promptTab === "tmpl")
    body = p.template != null ? `<pre>${highlightVars(p.template)}</pre>` : `<div class="mnote">template file not found</div>`;
  else if (p.sent == null)
    body = `<div class="mnote">no run captured yet — the snapshot is taken at the next launch of this scanner.</div>`;
  else {
    const { cap, body: txt } = sentParts(p.sent);
    body = `${cap ? `<div class="cap">${esc(cap)}</div>` : ""}<pre>${esc(txt)}</pre>`;
  }
  return `<div class="mback">
    <div class="mbox">
      <div class="mhead">
        <div><h2>${esc(name)} — prompt <span class="src">· from ${esc((p && p.file) || "…")}</span></h2>
          <div class="mmeta">rendered fresh at every launch · sent to ${esc(model ?? "–")}${effort ? ` (${esc(effort)})` : ""}</div></div>
        <button class="mx" data-act="closeModal" aria-label="Close">×</button>
      </div>
      <div class="tabs">
        <button class="btn small${UI.promptTab === "tmpl" ? " sel" : ""}" data-act="ptab" data-tab="tmpl">Template</button>
        <button class="btn small${UI.promptTab === "sent" ? " sel" : ""}" data-act="ptab" data-tab="sent">As sent last run</button>
      </div>
      <div class="mbody">${body}</div>
    </div></div>`;
}
async function openPrompt(name) {
  UI.promptName = name; UI.promptTab = "tmpl"; UI.prompt = null; render();
  let p;
  try { p = await (await fetch("/api/prompt?name=" + encodeURIComponent(name))).json(); }
  catch { p = { error: true }; }
  if (UI.promptName === name) { UI.prompt = p; render(); }
}
function closePrompt() { UI.promptName = null; UI.prompt = null; render(); }

function render() {
  if (!S) return;
  NOW = Math.floor(Date.now()/1000);
  document.body.classList.toggle("paused", !!S.paused);
  $("#banner").innerHTML = ((S.refill || {}).base_red && !UI.bannerGone) ? `
    <div class="banner">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 1.8L15 13.8H1L8 1.8z"/><path d="M8 6.5v3.2"/></svg>
      <span>dev branch is RED — every lane throttled to 1 worker until the base fix lands</span>
      <button class="x" data-act="dismissBanner" aria-label="Dismiss">×</button>
    </div>` : "";
  renderRail();
  $("#pane").innerHTML = PANES[UI.view]();
  $("#modal").innerHTML = promptModal();
  const res = S.resources || {};
  const disk = res.disk_free_mb != null ? (res.disk_free_mb/1024).toFixed(0) + " GB disk free" : null;
  $("#foot").innerHTML =
    `<span>Server: ${res.budget != null ? `budget ${esc(res.budget)} workers` : "–"} · load ${dash(res.load5)} of ${dash(res.cores)} cores · ${res.mem_mb != null ? (res.mem_mb/1024).toFixed(0) + " GB RAM free" : "–"}${disk ? " · " + disk : ""}</span>
     <span style="opacity:.4">|</span>
     <span>dispatcher</span><span class="dot sm ${S.dispatch === "active" && !S.paused ? "run" : ""}"></span>
     <span>${esc(S.dispatch ?? "–")}${S.paused ? " (paused)" : ""} · refreshed ${ago(S.generated_at)}</span>`;
}

/* ---------- fetch loop ---------- */
async function refresh() {
  try { S = await (await fetch("status.json", { cache:"no-store" })).json(); }
  catch { $("#pane").innerHTML = `<div class="crumb">status.json unavailable</div>`; return; }
  // don't repaint under an open popover, open modal, or while typing a goal
  if ($("#pop").classList.contains("open") || UI.promptName != null || document.activeElement?.tagName === "TEXTAREA") return;
  render();
}

/* ---------- popover ---------- */
const pop = $("#pop");
let popArg = null;
function openPop(btn) {
  popArg = JSON.parse(btn.dataset.arg);
  const cur = btn.dataset.cur;
  const groups = POPS[btn.dataset.pop](isNaN(cur) ? cur : Number(cur));
  pop.innerHTML = groups.map(g =>
    (g.grp ? `<div class="grp">${g.grp}</div>` : "") +
    g.items.map(o => `<button class="opt${String(o.v) === cur ? " cur" : ""}" data-v="${escA(o.v)}">
      <span>${esc(o.label)}</span><span class="tick">✓</span></button>`).join("")
  ).join("");
  const r = btn.getBoundingClientRect();
  pop.classList.add("open");
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  pop.style.left = Math.max(8, Math.min(r.left, innerWidth - pw - 12)) + "px";
  pop.style.top = (r.bottom + 6 + ph > innerHeight - 12 ? r.top - ph - 6 : r.bottom + 6) + "px";
}
function closePop() { pop.classList.remove("open"); popArg = null; }
pop.addEventListener("click", e => {
  const opt = e.target.closest(".opt"); if (!opt) return;
  let v = opt.dataset.v; if (/^\d+$/.test(v)) v = Number(v);
  const arg = popArg; closePop();
  APPLY[arg.k](arg, v);
});

/* ---------- actions ---------- */
document.addEventListener("click", e => {
  if (e.target.classList.contains("mback")) { closePrompt(); return; }
  const chipBtn = e.target.closest(".chip[data-pop]");
  if (chipBtn) { openPop(chipBtn); e.stopPropagation(); return; }
  if (!e.target.closest(".pop")) closePop();

  const railBtn = e.target.closest("[data-view]");
  if (railBtn) { UI.view = railBtn.dataset.view; UI.confirmAct = null; render(); return; }

  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, name = el.dataset.name;
  const needConfirm = id => { if (UI.confirmAct === id) { UI.confirmAct = null; return true; } UI.confirmAct = id; render(); return false; };

  if (a === "masterPause") api({ action: S.paused ? "system_resume" : "system_pause" },
      S.paused ? "system started — lanes resume within a minute" : "system paused — scanning, pacing and batches stop");
  else if (a === "dismissBanner") { UI.bannerGone = true; render(); }
  else if (a === "spendFilter") { UI.spendFilter = el.dataset.f; render(); }
  else if (a === "scanToggle") { const x = (S.scanners||[]).find(s => s.name === name);
    api({ action:"scanner_toggle", name }, `${name} ${x && x.enabled ? "removed from" : "back in"} the rotation`); }
  else if (a === "viewPrompt") openPrompt(name);
  else if (a === "ptab") { UI.promptTab = el.dataset.tab; render(); }
  else if (a === "closeModal") closePrompt();
  else if (a === "runNext") api({ action:"scanner_run_next", name }, `${name} queued for the next natural slot`);
  else if (a === "runNow") api({ action:"scanner_run_now", name }, `${name} launching now — bypasses pacing (uses quota)`);
  else if (a === "role") { const r = el.dataset.role;
    api({ action:"claude_role_toggle", role:r },
        S.claude_roles[r] ? `Claude will not ${r === "issues" ? "take new issue batches" : r === "scanner" ? "run scans" : "run promotion rounds"}`
                          : `Claude is back on ${r === "promote" ? "promotion" : r}`); }
  else if (a === "toggleProcs") { UI.procsOpen = !UI.procsOpen; render(); }
  else if (a === "promote") { if (needConfirm("promote"))
    api({ action:"promote_now" }, "promotion launched — dev → staging → main"); }
  else if (a === "genPreview") api({ action:"announce_preview" }, "generating preview — appears here in ~1 min");
  else if (a === "toggleNote") { UI.noteOpen = !UI.noteOpen; render(); }
  else if (a === "postNote") { if (needConfirm("postNote"))
    api({ action:"announce_now" }, "posting the note — watch this row"); }
  else if (a === "toggleGoal") { UI.goalOpen = !UI.goalOpen; render(); }
  else if (a === "toggleAssess") { UI.assessOpen = !UI.assessOpen; render(); }
  else if (a === "pauseCampaign") api({ action: el.dataset.paused ? "campaign_resume" : "campaign_pause" },
      el.dataset.paused ? "campaign resumed" : "campaign paused — no more checks until you resume");
  else if (a === "doneCampaign") api({ action:"campaign_done" }, "campaign archived");
  else if (a === "newCampaign") { UI.newCampOpen = true; render(); }
  else if (a === "cancelCampaign") { UI.newCampOpen = false; render(); }
  else if (a === "startCampaign") {
    const goal = ($("#goalText")?.value ?? "").trim();
    if (goal.length < 10) return toast("write the goal first (10+ chars)", true);
    if (goal.length > 2000) return toast("goal too long (max 2000 chars)", true);
    UI.newCampOpen = false;
    api({ action:"campaign_set", goal }, "campaign set — first gap analysis on the next tick");
  }
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (UI.promptName != null) closePrompt(); else closePop();
});

refresh(); setInterval(refresh, 20000);
</script>
</body>
</html>
